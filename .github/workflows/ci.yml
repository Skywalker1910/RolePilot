name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ROLEPILOT_AUTH_REQUIRED: '0'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - name: Isolate runtime test paths
        run: |
          echo "ROLEPILOT_DATA_DIR=$RUNNER_TEMP/backend-data" >> "$GITHUB_ENV"
          echo "ROLEPILOT_LIBRARY_ROOT=$RUNNER_TEMP/empty-library" >> "$GITHUB_ENV"
      - run: python -m ruff check backend tests scripts deploy/scripts
      - run: python -m ruff format --check backend tests scripts deploy/scripts
      - run: python -m pytest -q
      - run: python scripts/check_migrations.py
      - name: Dependency vulnerability audit
        run: |
          python -m venv "$RUNNER_TEMP/audit-venv"
          "$RUNNER_TEMP/audit-venv/bin/pip" install pip-audit==2.10.1
          "$RUNNER_TEMP/audit-venv/bin/pip-audit" -r requirements.lock --disable-pip --no-deps

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend audit --audit-level=high
      - name: Package this commit's source and tested build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: python scripts/build_release.py "$RELEASE_SHA" artifacts/release.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: release-${{ github.sha }}
          path: artifacts/release.tar.gz*
          if-no-files-found: error
          retention-days: 7

  integration:
    name: Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock
          npm --prefix frontend ci
      - run: .venv/bin/python scripts/smoke.py

  deployment-validation:
    name: Deployment Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock PyYAML==6.0.3
      - run: python scripts/repository_audit.py --staged
      - run: python scripts/validate_deployment.py
      - run: python -m pytest -q tests/test_deployment.py tests/test_backup.py tests/test_auth.py
      - name: Shell syntax
        run: |
          for script in deploy/scripts/*.sh deploy/scripts/rolepilot-deploy; do
            bash -n "$script"
          done

  deploy:
    name: Deploy to Production
    needs: [backend, frontend, integration, deployment-validation]
    if: >-
      github.repository == 'Skywalker1910/RolePilot' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.DEPLOYMENT_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: rolepilot-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://rolepilot.adityamore.dev
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Skip superseded commits
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$head" == "$RELEASE_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Superseded commit; waiting for the newer main commit to pass CI.'
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.latest.outputs.deploy == 'true'
        with:
          name: release-${{ github.sha }}
          path: artifacts
      - name: Transfer verified release and invoke restricted broker
        if: steps.latest.outputs.deploy == 'true'
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          LIGHTSAIL_SSH_HOST_KEY: ${{ secrets.LIGHTSAIL_SSH_HOST_KEY }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_SEQUENCE: ${{ github.run_number }}
        run: bash deploy/scripts/ssh_deploy.sh
